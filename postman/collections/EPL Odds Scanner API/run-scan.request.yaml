$kind: http-request
name: Run Scan
method: POST
url: '{{baseUrl}}/scans'
description: |-
  Triggers an arbitrage scan.

  By default this calls the configured odds provider using the backend
  `.env.local` settings. The current default provider is `api_football`.
  To test without using live provider credentials or API quota, add `"demo": true`
  to the request body.

  Returns a `ScanResponse` with:
  - `mode` - "demo", "api_football", or "the_odds_api"
  - `scanned_at` - ISO-8601 timestamp
  - `evaluated_market_count` - number of complete markets evaluated
  - `opportunity_count` - number of arb opportunities found
  - `opportunities` - list of `MarketEvaluation` objects
  - `warnings` - any advisory messages
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "bankroll": 100.0,
      "source": "api_football"
    }
